<title>UOS Campus Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-screen 3D campus (the Blender model), search panel top-left, room/building card below it,
   level switcher on the right edge, category filters bottom-left, camera tools bottom-right. */
:root{
  --bg:#eef1ee; --scene:#e4eae6; --fade:#e9ece9; --fade-edge:#d3d8d4; --surface:#ffffff; --surface-2:#f3f6f4;
  --fg:#18201b; --muted:#5d6a62; --line:#d5ddd7; --accent:#0d7a52; --accent-fg:#ffffff; --accent-soft:#dcefe6;
  --shadow:0 6px 24px rgba(20,40,30,.13); --r:14px;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --scene:#161c19; --fade:#232a26; --fade-edge:#2e3732; --surface:#1c221f; --surface-2:#242c28;
  --fg:#e8eee9; --muted:#9aa89f; --line:#333d37; --accent:#3fbf8a; --accent-fg:#06140d; --accent-soft:#1f3a2e;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --scene:#161c19; --fade:#232a26; --fade-edge:#2e3732; --surface:#1c221f; --surface-2:#242c28;
  --fg:#e8eee9; --muted:#9aa89f; --line:#333d37; --accent:#3fbf8a; --accent-fg:#06140d; --accent-soft:#1f3a2e;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
button{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* loading */
#load{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;transition:opacity .4s}
#load.done{opacity:0;pointer-events:none}
#load .box{width:min(320px,calc(100% - 48px));display:grid;gap:12px;text-align:center}
#load b{font-size:18px}
#load span{font-size:12.5px;color:var(--muted)}
#bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

/* left column */
#side{position:absolute;z-index:5;top:max(12px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));bottom:max(76px,env(safe-area-inset-bottom,0px));
  width:min(360px,calc(100% - 32px));display:flex;flex-direction:column;gap:10px;pointer-events:none;min-height:0}
#side>*{pointer-events:auto}
#side:has(#info:not([hidden])){width:min(620px,calc(100% - 32px))}
#panel{display:flex;flex-direction:column;min-height:0;flex:0 1 auto}
.brand{display:flex;align-items:center;gap:10px;padding:12px 14px 10px}
.brand b{font-size:15px}
.brand span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.search{margin:0 12px 10px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 10px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:500 14px var(--f-ui);padding:10px 0;outline:none}
.search:focus-within{border-color:var(--accent)}
.crumbs{display:flex;align-items:center;gap:6px;padding:0 14px 10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.crumbs button{all:unset;cursor:pointer;color:var(--accent);font-weight:700}
.crumbs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
#results{overflow:auto;border-top:1px solid var(--line);min-height:0;max-height:46vh}
.res{display:flex;gap:10px;align-items:center;padding:9px 14px;cursor:pointer;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left;font:inherit;color:inherit}
.res:hover,.res:focus-visible{background:var(--surface-2);outline:none}
.res>span{min-width:0}
.res .t{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .s{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .lv{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted);flex:none}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.hint{padding:10px 14px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);line-height:1.45}

/* info card */
#info{padding:14px 16px 16px;display:grid;gap:10px;overflow:auto;min-height:0;flex:0 1 auto;position:relative}
#info>*{min-width:0}
#info h2{margin:0;font-size:18px;line-height:1.25;text-wrap:balance;padding-right:28px}
#info .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:19px;cursor:pointer}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--fg);display:inline-flex;align-items:center;gap:5px}
.chip.mono{font-family:var(--f-mono);font-weight:500}
.chip.plain{background:var(--surface-2);border:1px solid var(--line)}
#info p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
.sec{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px;min-width:0}
.sec h3{margin:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}
.kv{display:grid;grid-template-columns:86px 1fr;gap:4px 10px;font-size:13px;align-items:baseline}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;font-weight:600}
.kv dd.empty{color:var(--muted);font-weight:500;font-style:italic}
.kv dd .copy{all:unset;cursor:pointer;margin-left:6px;font-size:11px;font-weight:700;color:var(--accent)}
.who{display:flex;gap:10px;align-items:center}
.who .av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.who b{display:block;font-size:14px}
.who span{font-size:12px;color:var(--muted)}
.timetable-scroll{overflow-x:auto;max-width:100%;min-width:0;border:1px solid var(--line);border-radius:9px}
.timetable{border-collapse:collapse;table-layout:fixed;min-width:720px;width:100%;font-size:11.5px}
.timetable th,.timetable td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;vertical-align:top;text-align:left;overflow-wrap:anywhere}
.timetable tr>:last-child{border-right:0}
.timetable tbody tr:last-child>*{border-bottom:0}
.timetable thead th{background:var(--surface-2);font-weight:800;position:sticky;top:0;z-index:1}
.timetable .time{width:112px;font:600 10.5px var(--f-mono);font-variant-numeric:tabular-nums;white-space:normal}
.timetable tbody th{background:var(--surface-2);color:var(--muted)}
.timetable .time{position:sticky;left:0;z-index:2;background:var(--surface-2)}
.timetable thead .time{z-index:3}
.timetable td{width:150px}
.timetable td:empty{background:var(--surface-2)}
.timetable .slot+.slot{margin-top:4px}
.slot{border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:7px;padding:4px 8px;background:var(--surface-2);min-width:0}
.slot.office{border-left-color:var(--accent);background:var(--accent-soft)}
.slot.class{border-left-color:#5b8fd6}
.slot t{display:block;font:600 11px var(--f-mono);font-variant-numeric:tabular-nums}
.slot s{display:block;text-decoration:none;font-size:12px;overflow-wrap:anywhere}
.free{font-size:11.5px;color:var(--muted);padding:5px 0;border-bottom:1px dashed var(--line)}
.btn{all:unset;cursor:pointer;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:13px;padding:9px 14px;border-radius:10px;text-align:center}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.list{display:grid;gap:4px}
.list button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;padding:5px 6px;border-radius:7px}
.list button:hover{background:var(--surface-2)}

/* levels, tools, filters */
#levels{position:absolute;z-index:5;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;padding:8px;align-items:center}
#levels .cap{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.lvbtn{width:46px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:800 14px var(--f-ui);cursor:pointer}
.lvbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.lvbtn.all{font-size:11px}
#tools{position:absolute;z-index:5;right:max(16px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px}
#tools button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:700 16px var(--f-ui);cursor:pointer;display:grid;place-items:center}
#filters{position:absolute;z-index:5;left:max(16px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;padding:8px;max-width:calc(100% - 260px)}
.fchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:999px;padding:5px 10px 5px 8px;font:700 11.5px var(--f-ui);cursor:pointer;white-space:nowrap}
.fchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fchip em{font-style:normal;color:var(--muted);font-weight:600}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);padding:8px 14px;font-size:12.5px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:8;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}

/* map labels */
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font-size:11px;font-weight:700;color:var(--fg);
  background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);padding:2px 8px;border-radius:999px;
  pointer-events:auto;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.1);display:flex;align-items:center;gap:5px;will-change:translate}
.lbl i{width:7px;height:7px;border-radius:50%;flex:none}
.lbl.bld{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:11px;flex-direction:column;gap:0;align-items:center}
.lbl.bld small{font-weight:500;font-size:10px;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis}
.lbl.bld.has{border-color:var(--accent)}
.lbl.bld.has::after{content:"Floor plans";font-size:9px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.lbl.lvl{font-size:12px;font-weight:800;background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.lbl.sel{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);z-index:3}
.lbl.sel i{background:var(--accent-fg)!important}
.lbl.pending{color:var(--muted);font-weight:500}
.lbl.off{display:none}

/* directions */
:root{--route:#1f6feb;--route-b:#d6336c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--route:#5b9dff;--route-b:#ff6b9a}}
:root[data-theme="dark"]{--route:#5b9dff;--route-b:#ff6b9a}
.brand .dirbtn{all:unset;margin-left:auto;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--accent);padding:7px 10px;border-radius:9px;background:var(--accent-soft)}
.brand .dirbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#dir{padding:12px 14px 12px;display:flex;flex-direction:column;gap:10px;min-height:0;flex:0 1 auto;overflow:hidden;position:relative}
#dir .dhead{display:flex;align-items:center;gap:8px}
#dir .dhead b{font-size:15px}
#dir .x{margin-left:auto;width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:19px;cursor:pointer}
.ends{display:grid;grid-template-columns:1fr 34px;gap:6px 6px;align-items:center}
.end{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 6px 0 8px;grid-column:1}
.end:focus-within{border-color:var(--accent)}
.end input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:600 13px var(--f-ui);padding:9px 0;outline:none}
.end .clr{all:unset;cursor:pointer;color:var(--muted);font-size:15px;padding:0 4px}
.pin{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:800 10px var(--f-ui);font-style:normal;color:#fff;flex:none}
.pin.a{background:var(--route)} .pin.b{background:var(--route-b)}
.swap{grid-column:2;grid-row:1/3;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:700 16px var(--f-ui);cursor:pointer}
.sug{border:1px solid var(--line);border-radius:10px;max-height:34vh;overflow:auto;margin-top:-4px}
.sf{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none}
.sf input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.sum{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sum b{font-size:20px;font-variant-numeric:tabular-nums}
.sum span{font-size:12.5px;color:var(--muted)}
.sum.err{color:var(--muted);font-size:12.5px;line-height:1.45}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px;overflow:auto;min-height:0;flex:0 1 auto}
.steps button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;width:100%;padding:7px 6px;border-radius:9px;font-size:12.5px;line-height:1.4}
.steps button:hover{background:var(--surface-2)}
.steps button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.steps button[aria-current="step"]{background:var(--accent-soft)}
.steps .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font:800 11px var(--f-ui);color:var(--muted)}
.steps .ic.go{background:var(--route);border-color:var(--route);color:#fff}
.steps .ic.fin{background:var(--route-b);border-color:var(--route-b);color:#fff}
.steps small{display:block;color:var(--muted);font-size:11.5px}
.dnav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.dnav .btn{padding:8px 6px;font-size:12.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .btn{padding:7px 12px;font-size:12.5px}
.lbl.rpin{font-weight:800;color:#fff;border-color:transparent;z-index:4;gap:6px}
.lbl.rpin.a{background:var(--route)} .lbl.rpin.b{background:var(--route-b)}
.lbl.rpin.transfer{background:var(--surface);color:var(--fg);border-color:var(--route);pointer-events:none}
.lbl.rpin em{font-style:normal;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:10px}

@media (max-width:760px){
  #side{bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 66px);max-height:none}
  #dir{position:static;flex:0 1 35%;max-height:none;overflow:auto}
  #dir .steps{max-height:22vh}
  #dir.compact .ends,#dir.compact .sf,#dir.compact #dsug{display:none}
  #dir.compact{flex-basis:25%}
  .brand span,#panel .hint{display:none}
  #results{max-height:34vh}
  #info{position:relative;flex:1 1 60%;max-height:none}
  #filters{display:none}
  #levels{top:auto;bottom:max(14px,env(safe-area-inset-bottom,0px));right:auto;left:max(12px,env(safe-area-inset-left,0px));transform:none;flex-direction:row}
  #levels .cap{display:none}
  #tools{flex-direction:row}
  #tools #zin,#tools #zout{display:none}
}
@media (prefers-reduced-motion:reduce){#load,#toast,#bar i{transition:none}}
</style>

<div id="app">
  <canvas id="gl" tabindex="0" aria-label="3D map of the University of Sharjah campus"></canvas>
  <div id="labels"></div>

  <div id="side">
    <section class="card" id="panel" aria-label="Search and location">
      <div class="brand"><div class="mark">UOS</div><div><b>Campus Map</b><br><span>University of Sharjah · Zone A</span></div>
        <button class="dirbtn" id="opendir" title="Get directions"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>Directions</button></div>
      <label class="search" for="q">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search buildings, rooms, instructors…" autocomplete="off">
      </label>
      <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
      <div id="results" hidden></div>
      <div class="hint" id="hint"></div>
    </section>
    <section class="card" id="dir" hidden aria-label="Directions">
      <div class="dhead"><b>Directions</b><button class="x" id="dirx" aria-label="Close directions">×</button></div>
      <div class="ends">
        <div class="end"><i class="pin a">A</i><input id="dfrom" placeholder="Start: room, office or building" autocomplete="off" aria-label="Start"><button class="clr" data-clr="from" aria-label="Clear start">×</button></div>
        <div class="end"><i class="pin b">B</i><input id="dto" placeholder="Destination" autocomplete="off" aria-label="Destination"><button class="clr" data-clr="to" aria-label="Clear destination">×</button></div>
        <button class="swap" id="dswap" aria-label="Swap start and destination" title="Swap">⇅</button>
      </div>
      <div class="sug" id="dsug" hidden></div>
      <label class="sf"><input type="checkbox" id="dsf"> Step-free route (lifts only, no stairs)</label>
      <div class="sum" id="dsum"></div>
      <ol class="steps" id="dsteps"></ol>
      <div class="dnav" id="dnav" hidden><button class="btn ghost" id="dprev">Back</button><button class="btn ghost" id="dall">Overview</button><button class="btn" id="dnext">Next</button></div>
    </section>
    <section class="card" id="info" hidden aria-live="polite"></section>
  </div>

  <div class="card" id="levels" hidden>
    <div class="cap">Level</div>
    <div id="lvbtns" style="display:contents"></div>
    <button class="lvbtn all" data-lv="all" aria-pressed="true">All</button>
  </div>
  <div class="card" id="filters" hidden aria-label="Show only"></div>
  <div class="card" id="tools">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">−</button>
    <button id="north" aria-label="Reset rotation" title="Reset rotation">N</button>
    <button id="home" aria-label="Whole campus" title="Whole campus">⌂</button>
  </div>
  <div class="card" id="toast" role="status"></div>
  <div id="load"><div class="box"><b>UOS Campus Map</b><div id="bar"><i></i></div><span id="loadmsg">Loading the 3D model…</span></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const HASH0 = location.hash;
const V3 = THREE.Vector3;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CAT = {
  office:{n:"Offices",one:"Office",c:"#7fa7d9"}, classroom:{n:"Classrooms",one:"Classroom",c:"#f0b35c"}, lab:{n:"Labs",one:"Lab",c:"#9c8ad8"},

function applyA9Directory(mapping){
  if (!A9_DIRECTORY) return;
  const categories = {
    "Office":"office", "Office Suite":"office", "Lab":"lab", "Classroom":"classroom",
    "Washroom":"washroom", "Prayer Room":"prayer", "Pantry":"service",
    "Mail Room":"service", "Conference Room":"service",
  };
  for (const r of ROOMS){
    if (r.b !== "A9" || ![1, 2].includes(r.lv) ||
        ["stairs", "elevator", "circulation"].includes(r.cat)) continue;
    // Mesh IDs are provisional. Only an explicit room-position match is valid.
    const match = mapping[r.id];
    if (!match) continue;
    const number = typeof match === "string" ? match : match.number;
    if (!number){
      r.name = match.name;
      r.directoryInfo = {number:null};
      if (r.name.startsWith("NOT MAPPED")) r.cat = "pending";
      continue;
    }
    const entry = A9_DIRECTORY.rooms[number];
    if (!entry || entry.level !== r.lv || entry.roomNumberConflict){
      console.warn("A9 directory match needs review", r.id, number);
      continue;
    }
    const inside = (match.inside || []).map(id => A9_DIRECTORY.rooms[id]).filter(Boolean);
    const people = entry.people || [];
    const occupants = [...people, ...inside.flatMap(room => room.people || [])];
    r.directoryInfo = {
      number, people, inside,
      instructor:occupants.map(p => p.name).filter(Boolean).join(" / "),
      email:occupants.map(p => p.email).filter(Boolean).join(" "),
      department:[...new Set(occupants.map(p => p.department).filter(Boolean))].join(" / "),
    };
    r.name = match.name || entry.roomName || number;
    if (categories[entry.roomType]) r.cat = categories[entry.roomType];
  }
}

function nineDigitPhone(value){
  const phone = String(value || "").trim();
  return /^\d{9}$/.test(phone) ? phone : "";
}

function directoryDetails(people){
  return people.map(person => {
    const schedule = person.schedule;
    const phone = nineDigitPhone(person.phone);
    let html = '<div class="sec"><h3>' + esc(person.name || "Office occupant") + '</h3><dl class="kv">' +
      '<dt>Title</dt>' + val(person.role) + '<dt>Department</dt>' + val(person.department) +
      '<dt>Email</dt>' + val(person.email, true) + (phone ? '<dt>Phone</dt>' + val(phone, true) : '') + '</dl></div>';
    if (!schedule) return html + '<p class="free">No schedule was photographed for this person.</p>';
    const period = [schedule.term, schedule.academicYear].filter(Boolean).join(" ");
    if (period) html += '<p class="meta">Posted timetable · ' + esc(period) + '</p>';
    html += '<div class="sec"><h3>Office hours</h3>' +
      week(schedule.officeHours, "office", "No office hours are listed in this notice.") + '</div>';
    html += '<div class="sec"><h3>Weekly schedule</h3>' +
      week(schedule.activities, null, "No activities are listed in this notice.") + '</div>';
    if (schedule.notes) html += '<p>' + esc(schedule.notes) + '</p>';
    return html;
  }).join("");
}

// the GLB exported from Blender is published as base64 inside a JSON file
async function loadModel(url){
  const res = await fetch(url); if (!res.ok) throw new Error("model "+res.status);
  const total = +res.headers.get("content-length") || 11.8e6, bar = $("bar").firstElementChild; let text;
  if (res.body && res.body.getReader){ const rd = res.body.getReader(), dec = new TextDecoder(), parts = []; let got = 0;
    for (;;){ const {done, value} = await rd.read(); if (done) break; got += value.length; parts.push(dec.decode(value, {stream:true})); bar.style.width = Math.min(96, got/total*100).toFixed(0)+"%"; }
    parts.push(dec.decode()); text = parts.join(""); } else text = await res.text();
  const b64 = JSON.parse(text).glb, bin = atob(b64), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  bar.style.width = "100%";
  return new Promise((ok, no) => new THREE.GLTFLoader().parse(buf.buffer, "", ok, no));
}
let campus;

  root.updateMatrixWorld(true);
  for (const b of BLD){
    b.root = root.getObjectByName(b.node) || root.getObjectByName(b.node.replace(/[^\w-]/g,""));
    if (b.root) b.root.traverse(o => o.userData.bid = b.id);
    b.center = new V3(b.c[0], 0, -b.c[1]); b.rad = Math.max(b.s[0], b.s[1])/2;
    b.label = mkLabel(`${esc(b.id)}<small>${esc(b.name)}</small>`, "bld"+(b.floors?" has":""));
    b.label.onclick = () => { if (!dirPick(b.id)) pickBuilding(b); };
    b.rooms = ROOMS.filter(r => r.b === b.id);
  }
  for (const r of ROOMS){
    r.info = r.directoryInfo || OFF[r.id] || null;
    const short = r.cat==="pending" && !r.directoryInfo ? "Not mapped" : rName(r);
    r.label = r.cat === "circulation" ? Object.assign(document.createElement("div"), {_on:false}) : mkLabel(`<i style="background:${CAT[r.cat].c}"></i>${esc(short.length>26?short.slice(0,25)+"…":short)}`, r.cat==="pending"?"pending":"");

    r.pos = P(r.p);
    if (roomNumber(r) && r.name !== short) r.label.title = r.name;
  }
  applyTheme(); resize();
  const v = viewCampus(); camera.position.copy(v.p); controls.target.copy(v.t);
  ui(); if (HASH0) try { history.replaceState(null, "", HASH0); } catch(e){}   // the first ui() pass must not wipe a shared link
  route(); requestAnimationFrame(frame);

// ---------- level slices: each floor is a clipped copy of the real building model ----------
function buildSlices(b){

    const wrap = new THREE.Group(), hold = new THREE.Group();
    b.root.parent.matrixWorld.decompose(hold.position, hold.quaternion, hold.scale);
    const g = b.root.clone(true); hold.add(g); wrap.add(hold);
    const lo = new THREE.Plane(new V3(0,1,0), 0), hi = new THREE.Plane(new V3(0,-1,0), 0), planes = [lo, hi];
    const cache = new Map(), cm = m => { if (!cache.has(m)){ const c = m.clone(); c.clippingPlanes = planes; c.side = THREE.DoubleSide; c.polygonOffset = true; c.polygonOffsetFactor = c.polygonOffsetUnits = 3; /* gallery slab lies 3 cm under the corridor floors: always behind them */ cache.set(m, c); } return cache.get(m); };

    const lay = (m, f) => { m.polygonOffset = true; m.polygonOffsetFactor = f; m.polygonOffsetUnits = f; return m; };
    const catMat = {}, mk = (c, op, f = 1) => lay(new THREE.MeshLambertMaterial({color:c, clippingPlanes:planes, side:THREE.DoubleSide, transparent:op<1, opacity:op}), f);
    const blk = FADE.has(b.id), white = new THREE.Color("#ffffff");

    const plain = mk("#f4f5f3", 1, 1), edgeMat = new THREE.LineBasicMaterial({color:css("--fade-edge"), clippingPlanes:planes}); edgeMat.userData.tok = "--fade-edge"; fadeMats.push(edgeMat);
    const toBlock = o => { o.geometry = blockGeo(o.geometry, BLOCK_H); o.add(new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 30), edgeMat)); };
    const dim = mk("#d9dcd9", .55), sel = mk(css("--accent"), 1); accentMats.push(sel);
    const shellMat = new THREE.MeshLambertMaterial({color:css("--fade-edge"), clippingPlanes:planes, side:THREE.FrontSide, transparent:true, opacity:.28, depthWrite:false}); lay(shellMat, 4); shellMat.userData.tok = "--fade-edge"; fadeMats.push(shellMat);
    const picks = [], stairs = [];
    g.traverse(o => { if (!o.isMesh) return;
      const r = byId[o.userData.room_id];
      if (r && r.mesh){ o.userData.room = r; o.material = catMat[r.cat]; o.position.y += .02; if (blk && r.cat !== "circulation") toBlock(o); else if (blk) o.geometry = plateGeo(o.geometry); if (r.lv === li && r.cat !== "circulation"){ picks.push(o); (r.objs ||= []).push(o); } }   // corridors: one floor, not clickable
      else if (blk && o.userData.room_id){ o.position.y += .02; if (FLAT.test(o.userData.room_id)){ o.material = catMat.circulation; o.geometry = plateGeo(o.geometry); } else { o.material = plain; toBlock(o); } }
      else if (blk && hasName(o, KEEP)){ if (/Step/i.test((Array.isArray(o.material) ? o.material[0] : o.material).name || "")) stairs.push(o); o.visible = false; }   // block from the steps only, not the stair hall floor
      else if (blk && isShell(o)) o.material = shellMat;
      else if (blk && hasName(o, /Entry_\d/)){ o.material = catMat.circulation; o.geometry = plateGeo(o.geometry); o.position.y += .02; }   // passage floors join the corridor
      else if (blk && hasName(o, /Atrium_Rail/)) o.material = shellMat;   // A9: light balustrade round the opening
      else if (blk && hasName(o, /Atrium_Galleries/)) o.material = Array.isArray(o.material) ? o.material.map(cm) : cm(o.material);   // low railing at the atrium edge
      else if (blk) o.visible = false;
      else o.material = Array.isArray(o.material) ? o.material.map(cm) : cm(o.material);
    });
    if (blk && stairs.length){ wrap.updateMatrixWorld(true); const v = new V3();
      const srs = b.rooms.filter(r => r.cat === "stairs" && r.lv === li);
      for (const o of stairs){ const pa = o.geometry.attributes.position, pts = [];
        const grab = (a, z) => { for (let i = 0; i < pa.count; i++){ v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld); if (v.y >= a && v.y <= z) pts.push([v.x, v.z]); } };

        if (pts.length < 3) continue; let hull = hull2(pts); if (hull.length < 3) continue;
        { const mx = hull.reduce((a, q) => a + q[0], 0)/hull.length, mz = hull.reduce((a, q) => a + q[1], 0)/hull.length;   // pull in 0.35 m so it stands apart from the rooms next to it
          hull = hull.map(q => { const dx = q[0]-mx, dz = q[1]-mz, d = Math.hypot(dx, dz) || 1, k = Math.max(0, d-.35)/d; return [mx+dx*k, mz+dz*k]; }); }
        const geo = new THREE.ExtrudeGeometry(new THREE.Shape(hull.map(q => new THREE.Vector2(q[0], -q[1]))), {depth:BLOCK_H, bevelEnabled:false});
        const m = new THREE.Mesh(geo, catMat.stairs); m.rotation.x = -Math.PI/2; m.position.y = fz + .02;
        m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), edgeMat)); wrap.add(m);
        const cx = hull.reduce((a, q) => a + q[0], 0)/hull.length, cz = hull.reduce((a, q) => a + q[1], 0)/hull.length;
        const r = srs.sort((x, y) => Math.hypot(x.pos.x-cx, x.pos.z-cz) - Math.hypot(y.pos.x-cx, y.pos.z-cz))[0];

      d.position.set(r.pos.x, b.floors[li] + .06, r.pos.z); d.userData.room = r; wrap.add(d); picks.push(d); (r.objs ||= []).push(d);
    }
    wrap.visible = false; scene.add(wrap);
    const lab = mkLabel(esc(b.levels[li]), "lvl"); lab.onclick = () => showLevel(li);
    return {wrap, lo, hi, picks, catMat, dim, sel, lab, fz, low:b.low[li], op:0};
  });
}
function paint(b){ if (!b || !b.slices) return;
  for (const r of b.rooms) if (r.objs){ const s = b.slices[r.lv];
    const m = state.sel === r || DIR.hi.has(r) ? s.sel : (state.filter && r.cat !== state.filter ? s.dim : s.catMat[r.cat]);
    r.objs.forEach(o => { o.material = m; if (!r.mesh && !r.blocked) o.scale.setScalar(state.sel === r ? 1.5 : 1); }); } }

const fitK = () => { const a = canvas.clientWidth/Math.max(1,canvas.clientHeight); return a < 1 ? Math.min(2.2, .85/a) : 1; };
function viewCampus(){ const k = fitK(); return {p:new V3(40, 230*k, 250*k), t:new V3(140, 0, -30)}; }
function viewBuilding(b, all){ const k = fitK(), r = Math.max(b.rad, 14), y = all && b.floors ? GAP*1.2 + 6 : b.h*.4;
  const m = all && b.floors ? 1.45 : 1; return {p:b.center.clone().add(new V3(r*1.25*k*m, y + r*1.7*k*m, r*2.0*k*m)), t:b.center.clone().setY(y)}; }
function viewLevel(b, li){ const k = fitK(), y = b.floors[li] + li*GAP, r = b.rad;
  return {p:b.center.clone().add(new V3(r*.12, y + r*2.5*k, r*1.15*k)), t:b.center.clone().setY(y)}; }
function viewRoom(r){ const y = r.B.floors[r.lv] + r.lv*GAP; return {p:new V3(r.pos.x + 3, y + 24, r.pos.z + 15), t:new V3(r.pos.x, y, r.pos.z)}; }
function flyTo(v, dur=1.1){ tween = {p0:camera.position.clone(), t0:controls.target.clone(), p1:v.p, t1:v.t, t:0, dur};
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) tween.t = dur; }
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

const epLabel = id => { const r = byId[id]; if (r) return rName(r)+" · "+r.b+" "+lvName(r.b, r.lv); const b = bById[id]; return b ? b.id+" · "+(b.name||"").split(" / ")[0] : ""; };
function setEnd(which, id, quiet){ DIR[which] = id || null; $(which === "from" ? "dfrom" : "dto").value = id ? epLabel(id) : ""; $("dsug").hidden = true;
  DIR.field = !DIR.from ? "from" : !DIR.to ? "to" : DIR.field; if (!quiet) recompute(); }
function recompute(){ DIR.res = DIR.from && DIR.to ? plan(DIR.from, DIR.to, {stepFree:DIR.sf}) : null; DIR.step = -1; drawRoute(DIR.res && !DIR.res.fail ? DIR.res : null);
  if (DIR.res && !DIR.res.fail && !DIR.res.same) focusStep(-1); else ui(); }
function dirPick(id){ if (!DIR.open || (DIR.from && DIR.to) || !endpoint(id)) return false;
  setEnd(DIR.field === "to" || DIR.from ? "to" : "from", id); return true; }
function fmtTime(s){ const m = Math.max(1, Math.round(s/60)); return m < 60 ? m+" min" : Math.floor(m/60)+" h "+(m%60)+" min"; }
function renderDir(){ if (!DIR.open) return; const R = DIR.res, sum = $("dsum"), st = $("dsteps");
  $("dir").classList.toggle("compact", !!(R && !R.fail && !R.same && DIR.step >= 0));
  st.innerHTML = ""; $("dnav").hidden = true; sum.className = "sum";
  if (!DIR.from || !DIR.to){ sum.className = "sum err"; sum.textContent = !DIR.from && !DIR.to ? "Pick a start and a destination. Type a room number, an instructor or a building, or click one on the map."
      : !DIR.from ? "Now pick where you are starting from. Type it or click it on the map." : "Now pick your destination. Type it or click it on the map."; return; }
  if (!R){ sum.className = "sum err"; sum.textContent = "No walking route is mapped for this place yet."; return; }
  if (R.same){ sum.className = "sum err"; sum.textContent = "The start and destination are the same place."; return; }
  if (R.fail){ sum.className = "sum err"; sum.textContent = DIR.sf ? "No step-free route was found between these places." : "No route was found between these places."; return; }
  sum.innerHTML = `<b>${fmtTime(R.time)}</b><span>${metres(R.len)} walk${R.lift ? " · uses a lift" : ""}${R.stairs ? " · uses stairs" : ""}${R.sf ? " · step-free" : ""}</span>`;
  R.steps.forEach((s, i) => { const li = document.createElement("li"), b = document.createElement("button");
    b.innerHTML = `<i class="ic ${s.cls||""}">${esc(s.ic)}</i><span>${esc(s.t)}<small>${esc(s.s)}</small></span>`;
    if (i === DIR.step) b.setAttribute("aria-current", "step"); b.onclick = () => focusStep(i); li.append(b); st.append(li); });
  $("dnav").hidden = false; $("dprev").disabled = DIR.step <= 0; $("dnext").disabled = DIR.step >= R.steps.length-1;
  const cur = st.querySelector('[aria-current="step"]'); if (cur) cur.scrollIntoView({block:"nearest"}); }
// camera that shows every point of the route in the part of the screen the cards leave free
const fitCam = new THREE.PerspectiveCamera();
function fitView(pts, y){ let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity; for (const p of pts){ x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  const P3 = pts.map(p => new V3(p[0], p[2] ?? y, -p[1])), W = canvas.clientWidth, H = canvas.clientHeight, dir = new V3(0, 1.05, .7).normalize();
  const side = $("side").getBoundingClientRect(), mob = W <= 760, card = mob ? $("dir").getBoundingClientRect() : null;
  const L = mob ? -.9 : Math.min(.2, (side.right + 16)/W*2 - 1), R = .9, T = mob ? Math.min(.8, 1 - ($("panel").getBoundingClientRect().bottom + 12)/H*2) : .82, B = mob ? Math.max(-.6, 1 - (card.top - 10)/H*2) : -.85;
  fitCam.copy(camera); fitCam.aspect = W/Math.max(1, H);
  const c = new V3((x0+x1)/2, y, -(y0+y1)/2), v = new V3();
  const bounds = d => { fitCam.position.copy(c).addScaledVector(dir, d); fitCam.updateMatrixWorld(); fitCam.lookAt(c); fitCam.near = .5; fitCam.far = 1e5; fitCam.updateProjectionMatrix(); fitCam.updateMatrixWorld();
    let a = 9, b = -9, e = 9, f = -9; for (const q of P3){ v.copy(q).project(fitCam); a = Math.min(a, v.x); b = Math.max(b, v.x); e = Math.min(e, v.y); f = Math.max(f, v.y); } return [a, b, e, f]; };
  let d = Math.max(20, Math.max(x1-x0, y1-y0)*1.2);
  for (let it = 0; it < 4; it++){   // centre the route in the free area, then size it to fit
    let lo = 8, hi = 4000; for (let k = 0; k < 30; k++){ const m = (lo+hi)/2, [a, b, e, f] = bounds(m); if (b-a <= R-L && f-e <= T-B) hi = m; else lo = m; } d = Math.max(hi*1.06, 30);
    const [a, b, e, f] = bounds(d), ox = ((a+b)/2 - (L+R)/2), oy = ((e+f)/2 - (T+B)/2);
    const right = new V3().setFromMatrixColumn(fitCam.matrixWorld, 0), up = new V3().setFromMatrixColumn(fitCam.matrixWorld, 1);
    const halfW = Math.tan(fitCam.fov*Math.PI/360)*d*fitCam.aspect, halfH = Math.tan(fitCam.fov*Math.PI/360)*d;
    c.addScaledVector(right, ox*halfW).addScaledVector(up, oy*halfH); c.y = y; }
  return {p:c.clone().addScaledVector(dir, d), t:c}; }
function legView(l){ if (l.type === "walk" && l.where === "out"){ if (state.b) campusView(); return fitView(l.pts, 0); }
  const b = bById[l.b]; if (l.type !== "walk"){ if (state.b !== b) enterBuilding(b); else { state.level = "all"; } return viewBuilding(b, true); }
  if (state.b !== b) enterBuilding(b); state.level = l.lv; return fitView(l.pts, b.floors[l.lv] + l.lv*GAP); }
function focusStep(i){ const R = DIR.res; if (!R || !R.legs.length) return; DIR.step = i; clearSel(); $("dir").classList.toggle("compact", i >= 0);
  let v;
  if (i < 0 || i >= R.steps.length){ DIR.step = -1;      // overview
    const outs = R.legs.filter(l => l.type === "walk" && l.where === "out"), bs = [...new Set(R.legs.filter(l => l.b).map(l => l.b))];
    if (outs.length || bs.length !== 1){ if (state.b) campusView(); const ends = [R.A, R.Z].map(ep => ep.kind === "room" ? [ep.r.B.c[0], ep.r.B.c[1], ep.r.B.h + 10] : [ep.nodes[0].p[0], ep.nodes[0].p[1], 5]);
      v = fitView(outs.flatMap(l => l.pts).concat(bs.map(id => [bById[id].c[0], bById[id].c[1]]), ends), 0); }
    else { const b = bById[bs[0]]; if (state.b !== b) enterBuilding(b); else state.level = "all"; v = viewBuilding(b, true); } }
  else { const s = R.steps[i], li = s.leg === -1 ? 0 : s.leg === -2 ? R.legs.length-1 : s.leg; v = legView(R.legs[li]);
    if (s.leg < 0){ const ep = s.leg === -1 ? R.A : R.Z; if (ep.kind === "room") v = viewRoom(ep.r); } }
  flyTo(v); ui(); }
$("opendir").onclick = () => { openDir(); (DIR.from ? $("dto") : $("dfrom")).focus(); };
$("dirx").onclick = closeDir;
$("dswap").onclick = () => { const a = DIR.from; setEnd("from", DIR.to, true); setEnd("to", a); };
$("dsf").onchange = e => { DIR.sf = e.target.checked; recompute(); };
$("dprev").onclick = () => focusStep(Math.max(0, DIR.step - 1));
$("dnext").onclick = () => focusStep(Math.min(DIR.res.steps.length-1, DIR.step + 1));
$("dall").onclick = () => focusStep(-1);
document.querySelectorAll("#dir .clr").forEach(b => b.onclick = () => { setEnd(b.dataset.clr, null); $(b.dataset.clr === "from" ? "dfrom" : "dto").focus(); });
for (const [fid, which] of [["dfrom", "from"], ["dto", "to"]]){ const inp = $(fid);
  inp.addEventListener("focus", () => { DIR.field = which; inp.select(); });
  inp.addEventListener("input", () => { const t = inp.value.trim().toLowerCase(), box = $("dsug"); box.innerHTML = ""; DIR.field = which;
    if (!t){ box.hidden = true; return; }
    const hits = findHits(t).filter(h => endpoint(h.id)); box.hidden = false;
    if (!hits.length){ box.innerHTML = `<div class="res" style="cursor:default"><span class="s">No mapped place matches “${esc(inp.value)}”.</span></div>`; return; }
    for (const h of hits.slice(0, 30)){ const x = document.createElement("button"); x.className = "res";
      x.innerHTML = `<i class="dot" style="background:${h.c}"></i><span><div class="t">${esc(h.t)}</div><div class="s">${esc(h.s)}</div></span><span class="lv">${h.lv}</span>`;
      x.onclick = () => { setEnd(which, h.id); if (which === "from" && !DIR.to) $("dto").focus(); else if (which === "to" && !DIR.from) $("dfrom").focus(); }; box.append(x); } });
  inp.addEventListener("keydown", e => { if (e.key === "Enter"){ const f = $("dsug").querySelector("button.res"); if (f) f.click(); } if (e.key === "Escape") $("dsug").hidden = true; }); }
})();
</script>
